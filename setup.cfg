[metadata]
name = qass_tools_networking
version = 0.0.1
author = Nicklas Osmers
author_email = nosmers@qass.net
description = Analytic package for qass_tools
long_description = file: README.md
long_description_content_type = text/markdown
url = https://git.qass.net/developers/qass_tools/qass_tools_networking
project_urls =
    Bug Tracker = https://git.qass.net/developers/qass_tools/qass_tools_networking/-/issues
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find_namespace:
python_requires = >=3.6

[options.packages.find]
where = src