[project]
name = "qass-tools-networking"
version = "3.8"
authors = [
  {name="Oliver Kowollik", email="okowollik@qass.net" },
  {name="Sammy Joe Lüling", email="slueling@qass.net" }
]
description = "Networking package for qass_tools"
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [                   
    "numpy>=1.19.5",
    "packaging"
]

[project.urls]
Homepage = "https://qass.github.io/"

[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "enum-tools[sphinx]>=0.6.1",
    "pytest>=7.0.1",
    "sphinx>=4.5.0",
    "sphinx-design>=0.0.13",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-toolbox>=1.6.2",
]
