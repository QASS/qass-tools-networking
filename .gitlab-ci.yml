variables:
  UV_VERSION: "0.9.16"
  PYTHON_VERSION: "3.9"
  BASE_LAYER: bookworm-slim
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy

uv:
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  script:
    # your `uv` commands

image: python:3.9

test-build-docs:
  stage: test
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  script:
    - uv sync --frozen --all-extras
    - uv run sphinx-build -b html ./docs/sources public  
  only:
    - merge_requests

build-package:
  stage: deploy
  script:
    - touch /tmp/.pypirc
    - cat $PYPIRC > /tmp/.pypirc
    - pip install --upgrade pip
    - pip install --upgrade build
    - pip install --upgrade twine
    - python3 -m build
    - python3 -m twine upload --repository gitlab dist/* --config-file /tmp/.pypirc
    - python3 -m twine upload --repository pypi dist/* --config-file /tmp/.pypirc
  only:
    - tags

pages:
  stage: deploy
  image: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
  script:
    - uv sync --frozen --all-extras
    - uv run sphinx-build -b html ./docs/sources public  
  artifacts:
    paths:
      - public
  only:
    - tags
